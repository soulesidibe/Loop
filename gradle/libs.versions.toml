[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization-json = "1.12.0"
clikt = "5.1.0"
kaml = "0.104.0"
liqp = "0.9.2.3"
sqlite-jdbc = "3.54.1.0"
junit-jupiter = "6.1.3"
ktlint-gradle = "14.2.0"
mcp-kotlin-sdk = "0.16.0"
slf4j = "2.0.18"
# The codex CLI the codex-app-server runner is built against (m3-02): its app server schema is committed in
# plugins/runner-codex-app-server/schema, regenerated by schema/regenerate.sh. Not a Maven artifact.
codex-cli = "0.167.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
liqp = { module = "nl.big-o:liqp", version.ref = "liqp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
# The SLF4J provider that logs nothing: the MCP SDK brings slf4j-api, and without a provider it warns on stderr.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Gradle plugin artifacts, used as implementation dependencies of build-logic.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
